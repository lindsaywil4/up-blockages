<style>
  html, body { margin:0; padding:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color:#222; }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { background:#0b1f3a; color:#fff; padding:12px 18px; box-shadow:0 2px 6px rgba(0,0,0,0.15); z-index:1000;}
  header h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:0.2px;}
  header .sub { font-size:12px; color:#b9c5d8; margin-top:3px;}
  .controls { display:flex; align-items:center; gap:14px; padding:10px 18px; background:#f4f6fa; border-bottom:1px solid #d8dde5; flex-wrap:wrap; z-index:1000;}
  .controls label { font-size:13px; color:#222; font-weight:500;}
  .yearbtns button { background:#fff; border:1px solid #b8c0cd; color:#0b1f3a; padding:6px 12px; margin:0 2px; cursor:pointer; border-radius:4px; font-size:13px; font-weight:500;}
  .yearbtns button:hover { background:#e8eef7;}
  .yearbtns button.active { background:#c8102e; color:#fff; border-color:#a30d24;}
  .weight-toggle { display:flex; align-items:center; gap:6px;}
  .weight-toggle select { font-size:13px; padding:5px 8px; border:1px solid #b8c0cd; border-radius:4px; background:#fff;}
  .stats { font-size:12px; color:#475063; margin-left:auto; line-height:1.4;}
  .stats b { color:#c8102e; }
  #map { flex:1; min-height:300px; }
  .legend { background:#fff; padding:10px 12px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,0.2); font-size:12px; color:#222; line-height:1.5;}
  .legend .grad { width:160px; height:10px; background:linear-gradient(to right, #2962ff, #00bfa5, #ffd600, #ff6d00, #c8102e); border-radius:2px; margin-top:4px;}
  .legend .grad-labels { display:flex; justify-content:space-between; font-size:10px; color:#666; width:160px; margin-top:2px;}
  footer { background:#f4f6fa; border-top:1px solid #d8dde5; padding:6px 18px; font-size:11px; color:#475063; text-align:center;}
  footer a { color:#0b1f3a; }
  .leaflet-tooltip { font-size:12px; }
  @media (max-width: 720px){
    .controls { flex-direction:column; align-items:flex-start; gap:8px;}
    .stats { margin-left:0;}
  }
</style>

const data = PAYLOAD.data;
const stats = PAYLOAD.stats;

// Map setup
const map = L.map('map', { preferCanvas: true, worldCopyJump: true }).setView([39.5, -98.5], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);

// Legend
const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<b>Heat intensity</b><br><span id="legendDesc">Blocked-crossing reports per location</span>'
    + '<div class="grad"></div>'
    + '<div class="grad-labels"><span>Low</span><span>High</span></div>';
  return div;
};
legend.addTo(map);

// Marker layer for top-locations (always-visible circles for context)
let markerLayer = L.layerGroup().addTo(map);
let heatLayer = null;

const yearOrder = ['All','2022','2023','2024','2025'];
let activeYear = 'All';
let weightMode = 'reports'; // or 'hours'

function buildHeatPoints(year, mode){
  const rows = data[year] || [];
  // Each row: [lat, lon, reports, hours, id, city, state, street]
  // Pick weight
  let raw = rows.map(r => mode === 'reports' ? r[2] : r[3]);
  if (raw.length === 0) return {points:[], rows:rows};
  // Normalize to 0..1 with sqrt scaling so a few extreme outliers (Houston) don't drown out everything else
  const max = Math.max(...raw.map(v => Math.sqrt(v)));
  const points = rows.map((r, i) => {
    const v = mode === 'reports' ? r[2] : r[3];
    const w = max > 0 ? Math.sqrt(v) / max : 0;
    return [r[0], r[1], Math.max(0.05, w)]; // floor so tiny points still show
  });
  return {points, rows};
}

function buildMarkers(rows, mode){
  markerLayer.clearLayers();
  // Only show top 60 by chosen metric to avoid clutter
  const idx = mode === 'reports' ? 2 : 3;
  const sorted = rows.slice().sort((a,b)=>b[idx]-a[idx]).slice(0, 60);
  sorted.forEach(r => {
    const reports = r[2], hours = r[3];
    const radius = 4 + Math.sqrt(r[idx]) * (mode === 'reports' ? 0.6 : 0.18);
    const m = L.circleMarker([r[0], r[1]], {
      radius: Math.min(radius, 22),
      color: '#c8102e', weight:1, fillColor:'#c8102e', fillOpacity:0.55,
    });
    m.bindTooltip(
      `<b>${r[5] || '(unknown city)'}, ${r[6] || ''}</b><br>` +
      `Crossing #${r[4]} — ${r[7] || ''}<br>` +
      `<b>${reports.toLocaleString()}</b> reports · <b>${hours.toLocaleString()}</b> hrs blocked`,
      {direction:'top'}
    );
    markerLayer.addLayer(m);
  });
}

function render(){
  const {points, rows} = buildHeatPoints(activeYear, weightMode);
  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  if (points.length){
    heatLayer = L.heatLayer(points, {
      radius: 22, blur: 18, maxZoom: 11, minOpacity: 0.35,
      gradient: {0.0:'#2962ff', 0.25:'#00bfa5', 0.5:'#ffd600', 0.75:'#ff6d00', 1.0:'#c8102e'}
    }).addTo(map);
  }
  buildMarkers(rows, weightMode);
  const s = stats[activeYear] || {crossings:0, reports:0, duration_hours:0};
  document.getElementById('stats').innerHTML =
    `<b>${s.reports.toLocaleString()}</b> reports across <b>${s.crossings.toLocaleString()}</b> UP crossings · ` +
    `<b>${Math.round(s.duration_hours).toLocaleString()}</b> hours blocked`;
  document.getElementById('legendDesc').textContent =
    weightMode === 'reports' ? 'Blocked-crossing reports per location' : 'Total hours blocked per location';
}

// Year buttons
const btnRow = document.getElementById('yearbtns');
yearOrder.forEach(y => {
  const b = document.createElement('button');
  b.textContent = y;
  b.dataset.year = y;
  if (y === activeYear) b.classList.add('active');
  b.addEventListener('click', () => {
    activeYear = y;
    [...btnRow.children].forEach(c => c.classList.toggle('active', c.dataset.year === y));
    render();
  });
  btnRow.appendChild(b);
});
document.getElementById('weightSel').addEventListener('change', e => {
  weightMode = e.target.value;
  render();
});

render();
</script>
